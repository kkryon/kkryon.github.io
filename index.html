<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSF Project Visualization</title>
  <style>
    /* Reset defaults */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2.5em;
      color: #444;
    }

    p.description {
      margin-bottom: 30px;
      font-size: 1.1em;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background-color: #4a90e2;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 50px;
      font-size: 1.1em;
      transition: background-color 0.3s, transform 0.3s;
    }

    .btn:hover {
      background-color: #357ABD;
      transform: translateY(-3px);
    }
    
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NSF Project Visualization</h1>
    <p class="description">Welcome to our data visualization project. Explore our interactive maps created with BERTopic and LDA methodologies.</p>
    <a class="btn" href="-bertopic_map.html">BERTopic Map</a>
    <a class="btn" href="lda_map.html">LDA Map</a>
  </div>
</body>
</html>
